spring:
  application:
    name: fleetbite-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/fleetbite
    username: fleetbite
    password: fleetbite

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

fleetbite:
  restaurant:
    location:
      # Ibuki Sushi Bar, Av. Manuel Olguín 561, Santiago de Surco
      latitude: ${RESTAURANT_LATITUDE:-12.0919738}
      longitude: ${RESTAURANT_LONGITUDE:-76.9737017}
  security:
    jwt:
      secret: ${JWT_SECRET}
      # Access JWT lifetime (seconds)
      expiration-seconds: ${JWT_EXPIRATION:3600}
      # Opaque refresh token lifetime (seconds); default 7 days
      refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION:604800}
    cors:
      allowed-origin: ${FRONTEND_ALLOWED_ORIGIN:http://localhost:8443}
    login-rate-limit:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:10}
      window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
