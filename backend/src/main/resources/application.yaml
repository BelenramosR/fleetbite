spring:
  application:
    name: fleetbite-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/fleetbite
    username: fleetbite
    password: fleetbite

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
